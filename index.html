<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cronograma semanal do Laboratório de Informática - 2026">
  <title>Cronograma do Laboratório de Informática - Colégio Estadual do Campo Dr Julio Junqueira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F1EEE3;
      --card: #FBF9F1;
      --ink: #25291F;
      --board: #1F2E28;
      --board-chalk: #EFE9D8;
      --muted: #6B6A5E;

      --manha: #D99A2B;
      --tarde: #4B4A8C;

      --seg: #4C7A6B;
      --ter: #C98A2B;
      --qua: #3E6E8E;
      --qui: #A85447;
      --sex: #6C5B8C;

      --radius: 8px;
      --gap: 14px;
      --shadow: 0 1px 3px rgb(0 0 0 / 8%);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      padding-bottom: 48px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }

    .board {
      padding: 38px 32px 30px;
      text-align: center;
      color: var(--board-chalk);
      background:
        radial-gradient(circle at 8% 20%, rgb(255 255 255 / 3%) 0, transparent 40%),
        radial-gradient(circle at 90% 80%, rgb(255 255 255 / 3%) 0, transparent 40%),
        var(--board);
      border-bottom: 6px solid #16201B;
    }

    .board h1 {
      margin: 0 0 6px;
      font: 700 2.5rem/1.1 Kalam, cursive;
      letter-spacing: .5px;
      text-shadow: 0 0 1px rgb(239 233 216 / 40%);
    }

    .sub {
      margin-bottom: 20px;
      color: #C9C3AE;
      font: .82rem/1.4 "JetBrains Mono", monospace;
      letter-spacing: .06em;
    }

    .inventory,
    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .chip {
      padding: 6px 12px;
      border: 1px solid rgb(239 233 216 / 25%);
      border-radius: 20px;
      background: rgb(239 233 216 / 8%);
      color: var(--board-chalk);
      font: .75rem/1.3 "JetBrains Mono", monospace;
    }

    .legend {
      gap: 22px;
      padding: 16px 20px 4px;
      color: var(--muted);
      font: .78rem/1.3 "JetBrains Mono", monospace;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
    }

    .dot.manha { background: var(--manha); }
    .dot.tarde { background: var(--tarde); }

    .week {
      display: grid;
      grid-template-columns: repeat(5, minmax(240px, 1fr));
      gap: var(--gap);
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px 24px;
      overflow-x: auto;
    }

    .day {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 240px;
    }

    .day-head {
      position: relative;
      padding: 10px 14px 12px;
      border-radius: 10px 10px 3px 3px;
      color: #fff;
      text-align: center;
      font: 700 1.25rem/1.2 Kalam, cursive;
    }

    .day-head::after {
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 60%;
      height: 8px;
      content: "";
      transform: translateX(-50%) rotate(-2deg);
      opacity: .5;
      filter: brightness(.8);
      background: inherit;
      border-radius: 3px;
    }

    .seg .day-head { background: var(--seg); }
    .ter .day-head { background: var(--ter); }
    .qua .day-head { background: var(--qua); }
    .qui .day-head { background: var(--qui); }
    .sex .day-head { background: var(--sex); }

    .time-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .time-group > .card {
      min-width: 0;
      flex: 1 1 0;
    }

    .card {
      padding: 10px 12px;
      background: var(--card);
      border-left: 4px solid transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .seg .card { border-left-color: var(--seg); }
    .ter .card { border-left-color: var(--ter); }
    .qua .card { border-left-color: var(--qua); }
    .qui .card { border-left-color: var(--qui); }
    .sex .card { border-left-color: var(--sex); }

    .row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .time {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font: 600 .72rem/1.3 "JetBrains Mono", monospace;
      white-space: nowrap;
    }

    .turma {
      font-weight: 700;
      font-size: .82rem;
      text-align: right;
    }

    .disc {
      margin-bottom: 2px;
      font-size: .86rem;
      font-weight: 600;
    }

    .prof {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 400;
    }

    .activity {
      margin-bottom: 6px;
      color: #4A4738;
      font-size: .8rem;
      line-height: 1.35;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      color: var(--muted);
      font: .7rem/1.3 "JetBrains Mono", monospace;
    }

    .suggestion {
      display: block;
      margin-top: 6px;
      padding: 5px 7px;
      border-radius: 6px;
      background: #E7EBEF;
      color: #3E4A57;
      font-size: .7rem;
      line-height: 1.35;
    }

    .free-slot {
      padding: 10px;
      border: 1px dashed #C9C3AE;
      border-radius: var(--radius);
      color: #9A9584;
      text-align: center;
      font: .72rem/1.3 "JetBrains Mono", monospace;
    }

    @media (max-width: 1100px) {
      .week {
        grid-template-columns: repeat(5, minmax(260px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .board {
        padding: 28px 16px 24px;
      }

      .board h1 {
        font-size: 1.9rem;
      }

      .week {
        grid-template-columns: repeat(5, minmax(250px, 1fr));
        padding: 16px;
      }

      .time-group {
        flex-direction: column;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }

      .board {
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .week {
        max-width: none;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
        overflow: visible;
      }

      .day {
        min-width: 0;
      }

      .card,
      .free-slot {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <header class="board">
    <h1>🖥 Laboratório de Informática</h1>
    <div class="sub">CRONOGRAMA · 2026</div>

    <div class="inventory" aria-label="Recursos disponíveis">
      <span class="chip">24 Chromebooks pretos</span>
      <span class="chip">8 Chromebooks cinza</span>
      <span class="chip">12 Tablets — atualmente 11 disponíveis</span>
      <span class="chip">Responsáveis: manhã — Samuel | tarde — Camila Santana</span>
    </div>
  </header>

  <div class="legend" aria-label="Legenda de períodos">
    <span><span class="dot manha"></span> Manhã</span>
    <span><span class="dot tarde"></span> Tarde</span>
  </div>

  <main id="week" class="week" aria-label="Cronograma semanal"></main>

  <script>
    /*
      O conteúdo do cronograma fica centralizado neste objeto.
      Para alterar uma aula, basta editar os dados aqui — não é
      necessário mexer na estrutura HTML.
    */
    const schedule = {
      "Segunda": {
        className: "seg",
        items: [
          ["4ª aula", "manha", "7° ano", "Inglês", "Paulina", "Inglês Paraná", "12"],
          ["5ª aula", "manha", "1ª série", "Matemática", "Sandra Mara", "Khan Academy", "26", "Chromes/Tablets"]
        ]
      },

      "Terça": {
        className: "ter",
        items: [
          ["1ª aula", "manha", "3ª série", "Inglês", "Paulina", "Inglês Paraná", "21", "Chromes/Tablets"],
          ["1ª aula", "manha", "9° ano", "Programação", "Luli", "Alura", "16"],
          ["2ª aula", "manha", "3ª série", "Inglês", "Paulina", "Inglês Paraná", "21", "Chromes/Tablets"],
          ["2ª aula", "manha", "9° ano", "Programação", "Luli", "Alura", "16"],
          ["5ª aula", "manha", "8° ano", "Inglês", "Paulina", "Inglês Paraná", "15"],
          ["5ª aula", "manha", "9° ano", "Português", "Gisele", "Redação Paraná", "16"],
          ["6ª aula", "manha", "2ª série", "Matemática", "Luli", "Khan Academy", "12", "Chromes/Tablets"],
          ["3ª aula", "tarde", "8° ano", "Programação e Robótica", "Luli", "Alura", "15"],
          ["4ª aula", "tarde", "6° ano", "Programação e Robótica", "Luli", "Alura", "20", "Lab. Info + 4 Chromes"],
          ["5ª aula", "tarde", "6° ano", "Programação e Robótica", "Luli", "Alura", "20", "Lab. Info + 4 Chromes"]
        ]
      },

      "Quarta": {
        className: "qua",
        items: [
          ["1ª aula", "manha", "7° ano", "Estudo Orientado", "Luli", "Desafio Paraná – Quizizz", "12"],
          ["2ª aula", "manha", "7° ano", "Estudo Orientado", "Luli", "Desafio Paraná – Quizizz", "12"],
          ["3ª aula", "manha", "1ª série", "Língua Portuguesa", "Gisele Kuhn", "Redação Paraná", "26", "Chromes/Tablets"],
          ["5ª aula", "manha", "6° ano", "Inglês", "Paulina", "Inglês Paraná", "20"],
          ["5ª aula", "manha", "1° ano", "Matemática", "Sandra", "Khan Academy", "26", "Chromes/Tablets"],
          ["6ª aula", "manha", "2ª série", "Língua Portuguesa", "Gisele Kuhn", "Leia Paraná", "12"],
          ["2ª aula", "tarde", "6° ano", "Estudo Orientado", "Luli", "Desafio Paraná – Quizizz", "20"],
          ["3ª aula", "tarde", "6° ano", "Estudo Orientado", "Luli", "Desafio Paraná – Quizizz", "20"],
          ["3ª aula", "tarde", "9° ano", "Matemática", "Sandra", "Khan Academy", "16", "Chromes/Tablets"],
          ["4ª aula", "tarde", "6° ano", "Língua Portuguesa", "Vera", "Redação Paraná", "20", "Chromes/Tablets"],
          ["4ª aula", "tarde", "8° ano", "Matemática", "Sandra Mara", "Mundo Invertido", "15"],
          ["5ª aula", "tarde", "6° ano", "Língua Portuguesa", "Vera", "Redação Paraná", "20", "Chromes/Tablets"],
          ["5ª aula", "tarde", "8° ano", "Matemática", "Sandra Mara", "Mundo Invertido", "15"]
        ]
      },

      "Quinta": {
        className: "qui",
        items: [
          ["1ª aula", "manha", "2ª série", "Língua Portuguesa", "Gisele Kuhn", "Redação Paraná", "12"],
          ["2ª aula", "manha", "3ª série", "Matemática", "Sandra Mara", "Enem Paraná", "21", "Chromes/Tablets"],
          ["4ª aula", "manha", "3ª série", "Língua Portuguesa", "Gisele Kuhn", "Redação Paraná", "21"],
          ["5ª aula", "manha", "3ª série", "Matemática", "Carlos Araújo", "Khan Academy", "21"],
          ["5ª aula", "manha", "1ª série", "Programação e IA", "Luli", "Alura", "26", "Chromes/Tablets"],
          ["6ª aula", "manha", "1ª série", "Programação e IA", "Luli", "Alura", "26"],
          ["1ª aula", "tarde", "9° ano", "Pensamento Lógico", "Luli", "Khan Academy", "16"],
          ["1ª aula", "tarde", "6° ano", "Língua Portuguesa", "Vera", "Leia Paraná", "20"],
          ["2ª aula", "tarde", "8° ano", "Língua Portuguesa", "Gisele Kuhn", "Redação Paraná", "15"],
          ["3ª aula", "tarde", "6° ano", "Matemática", "Evaldo", "Matific", "20"],
          ["3ª aula", "tarde", "8° ano", "Redação e Leitura", "Mônica", "Redação Paraná", "15", "Chromes/Tablets"],
          ["4ª aula", "tarde", "8° ano", "Programação e Robótica", "Luli", "Alura", "15", "Chromes/Tablets"],
          ["5ª aula", "tarde", "7° ano", "Redação e Leitura", "Mônica", "Redação Paraná", "12"]
        ]
      },

      "Sexta": {
        className: "sex",
        items: [
          ["1ª aula", "manha", "2ª série", "Matemática", "Luli", "Khan Academy", "12"],
          ["2ª aula", "manha", "2ª série", "Inglês", "Paulina", "Inglês Paraná", "12"],
          ["3ª aula", "manha", "2ª série", "Inglês", "Paulina", "Inglês Paraná", "12"],
          ["4ª aula", "manha", "2ª série", "Literatura e Prod. Textos", "Mônica", "Redação Paraná", "12"],
          ["5ª aula", "manha", "3ª série", "Inglês", "Luis Fernando", "Enem Paraná", "21"],
          ["1ª aula", "tarde", "6° ano", "Matemática", "Carlos Araújo", "Matific", "12"],
          ["1ª aula", "tarde", "9° ano", "Inglês", "Luis Fernando", "Inglês Paraná", "16"],
          ["2ª aula", "tarde", "6° ano", "Matemática", "Evaldo", "Matific", "20"],
          ["3ª aula", "tarde", "9° ano", "Matemática", "Carlos Araújo", "Khan Academy", "16"],
          ["4ª aula", "tarde", null, null, null, null, null, "— livre"],
          ["5ª aula", "tarde", "8° ano", "Estudo Orientado", "Luli", "Desafio Paraná – Quizizz", "15"]
        ]
      }
    };

    const week = document.querySelector("#week");

    const cardTemplate = (item) => {
      const [time, period, turma, disc, prof, activity, students, suggestion] = item;

      if (!turma) {
        return `<div class="free-slot">${time} tarde — livre</div>`;
      }

      return `
        <article class="card">
          <div class="row-top">
            <span class="time">
              <span class="dot ${period}"></span>${time}
            </span>
            <span class="turma">${turma}</span>
          </div>
          <div class="disc">${disc} <span class="prof">· ${prof}</span></div>
          <div class="activity">${activity}</div>
          <div class="meta">
            <span>👥 ${students}</span>
          </div>
          ${suggestion ? `<div class="suggestion">${suggestion}</div>` : ""}
        </article>
      `;
    };

    /*
      Aulas do mesmo horário são agrupadas automaticamente.
      Assim, basta cadastrar duas ou mais aulas com o mesmo período
      e número de aula para que apareçam lado a lado.
    */
    const groupByLesson = (items) => {
      const groups = new Map();

      for (const item of items) {
        const key = `${item[1]}-${item[0]}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      return [...groups.values()];
    };

    for (const [dayName, day] of Object.entries(schedule)) {
      const section = document.createElement("section");
      section.className = `day ${day.className}`;
      section.innerHTML = `<h2 class="day-head">${dayName}</h2>`;

      for (const group of groupByLesson(day.items)) {
        const container = group.length > 1
          ? document.createElement("div")
          : document.createDocumentFragment();

        if (group.length > 1) {
          container.className = "time-group";
          container.innerHTML = group.map(cardTemplate).join("");
          section.appendChild(container);
        } else {
          section.insertAdjacentHTML("beforeend", cardTemplate(group[0]));
        }
      }

      week.appendChild(section);
    }
  </script>
</body>
</html>
